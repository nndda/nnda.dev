# https://lefthook.dev/configuration/

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: ESLint
      run: bun lint:scripts '{staged_files}'
      glob:
        - '*.ts'
        - '*.js'
      stage_fixed: true

    - name: Stylelint
      run: bun lint:styles '{staged_files}'
      glob: '*.scss'
      stage_fixed: true

pre-push:
  jobs:
    - name: Packages audit
      run: bun run audit --audit-level=moderate
      glob:
        - package.json
        - bun.lock
